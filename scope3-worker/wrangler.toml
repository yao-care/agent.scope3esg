name = "scope3-worker"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "scope3"
database_id = "b49b85a5-b624-4b4f-bc59-85454aa6077f"

[[r2_buckets]]
binding = "FILES"
bucket_name = "scope3-files"

[[queues.producers]]
binding = "SUBMISSION_QUEUE"
queue = "scope3-pull-jobs"

[[queues.consumers]]
queue = "scope3-pull-jobs"
max_batch_size = 10
max_batch_timeout = 30

[vars]
GITHUB_APP_ID = "3863190"
WORKER_BASE_URL = "https://scope3-worker.lightman-chang.workers.dev"

# Secrets（set via: wrangler secret put <KEY>）:
# GITHUB_APP_PRIVATE_KEY   ← 必要（App 設定頁產生 .pem）
# GITHUB_WEBHOOK_SECRET    ← 必要（App webhook secret）
# RESEND_API_KEY           ← 選用；未設則略過寄送供應商邀請信
