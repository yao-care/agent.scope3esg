name: Calculate Emissions

on:
  push:
    branches: [main]
    paths:
      - 'submissions/**'

permissions:
  contents: write

jobs:
  calculate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Calculate emissions
        run: node scripts/calculate.mjs
      - name: Commit aggregate
        run: |
          git config user.name "scope3-bot"
          git config user.email "bot@scope3.yao.care"
          git add data/submissions.json
          git diff --staged --quiet || git commit -m "calc: rebuild submissions aggregate [skip ci]"
          git push
